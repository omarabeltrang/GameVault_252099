<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Formulario de Juego | GameVault</title></head>
<body>
    <main class="centro">
        <div class="tarjeta formulario">
            <h2 th:text="${modo == 'editar'} ? 'Editar Juego' : 'Añadir Nuevo Juego'">Nuevo Juego</h2>
            <p class="muted">Sube la información y la portada de tu juego a la bóveda.</p>
            <form th:action="${modo == 'editar'} ? @{/juegos/actualizar/{id}(id=${juego.id})} : @{/juegos/guardar}"
                  method="post" enctype="multipart/form-data">
                <label>Título del juego</label>
                <input name="titulo" th:value="${juego.titulo}" required maxlength="255">
                <label>Categoría</label>
                <select name="categoria" required>
                    <option value="Acción" th:selected="${juego.categoria == 'Acción'}">Acción</option>
                    <option value="Aventura" th:selected="${juego.categoria == 'Aventura'}">Aventura</option>
                    <option value="RPG" th:selected="${juego.categoria == 'RPG'}">RPG</option>
                    <option value="Estrategia" th:selected="${juego.categoria == 'Estrategia'}">Estrategia</option>
                    <option value="Deportes" th:selected="${juego.categoria == 'Deportes'}">Deportes</option>
                    <option value="Puzzle" th:selected="${juego.categoria == 'Puzzle'}">Puzzle</option>
                    <option value="Otros" th:selected="${juego.categoria == 'Otros'}">Otros</option>
                </select>
                <label>Precio (Bs)</label>
                <input name="precio" type="number" step="0.01" min="0" th:value="${juego.precio}" required>
                <label>Descripción breve</label>
                <textarea name="descripcion" rows="4" th:text="${juego.descripcion}" placeholder="Escribe una sinopsis..."></textarea>
                <label>Subir Portada (Imagen)</label>
                <input name="portada" type="file" accept="image/png,image/jpeg,image/webp">
                <small class="muted">PNG, JPG o WEBP, máximo 5 MB.</small>
                <button class="btn gradiente" type="submit" th:text="${modo == 'editar'} ? 'Actualizar Juego' : 'Guardar en mi Bóveda'">Guardar</button>
            </form>
        </div>
    </main>
</body>
</html>
